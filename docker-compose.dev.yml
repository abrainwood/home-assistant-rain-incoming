# This compose file is shared between `make dev` (ha-dev-config volume) and
# the E2E test fixture (ha-e2e-config volume). The two contexts pick their
# volume via the HA_VOLUME env var. NEVER run `docker compose down -v`
# against this file - it removes ALL volumes declared below, including the
# dev volume that isn't in use by the current context.

services:
  homeassistant:
    container_name: ${HA_CONTAINER:-ha-dev}
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # Mount the custom component directly - edits reflect on restart
      - ./custom_components/rain_incoming:/config/custom_components/rain_incoming:ro
      # Persist HA config/state across restarts
      - ${HA_VOLUME:-ha-dev-config}:/config
    environment:
      # When set, RainViewer API calls go to the mock server instead.
      # Leave unset for real API (manual dev testing).
      - RAINVIEWER_API_URL=${RAINVIEWER_API_URL:-}
      - RAINVIEWER_TILE_URL=${RAINVIEWER_TILE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HA_PORT:-8123}:8123"
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ha-dev-config:
  ha-e2e-config:
