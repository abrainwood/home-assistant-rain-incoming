sonar.projectKey=abrainwood_home-assistant-rain-incoming
sonar.organization=abrainwood

sonar.sources=custom_components/rain_incoming,scripts
sonar.tests=tests
sonar.python.version=3.12

# Coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclude test fixtures, generated files, and shell/setup scripts from analysis.
# Per-issue diagnostic scripts (scripts/diagnose_*.py / inspect_*.py / spatial_*.py)
# are excluded as throwaway investigation tooling - they intentionally have no
# tests and use /tmp default paths for one-shot local diagnostics.
sonar.exclusions=tests/fixtures/**,docs/**,scripts/*.sh,scripts/dev-setup.py,scripts/diagnose_*.py,scripts/inspect_*.py,scripts/spatial_*.py

# Encoding
sonar.sourceEncoding=UTF-8
