name: Contract Tests

on:
  schedule:
    # Run daily at 06:00 UTC - catches upstream API changes
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests against live RainViewer API
        run: pytest tests/contract/ -v --override-ini="asyncio_mode=auto" -p no:socket
