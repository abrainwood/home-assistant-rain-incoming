name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: pytest tests/unit/ tests/integration/ -v --tb=short --cov=custom_components/incoming_rain --cov-report=term-missing

      - name: Check coverage threshold
        run: pytest tests/unit/ tests/integration/ --cov=custom_components/incoming_rain --cov-fail-under=80 -q
