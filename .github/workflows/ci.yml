name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: pytest tests/unit/ tests/integration/ -v --tb=short --cov=custom_components/rain_incoming --cov=scripts --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Check coverage threshold
        run: pytest tests/unit/ tests/integration/ --cov=custom_components/rain_incoming --cov=scripts --cov-fail-under=80 -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e-golden:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Cache HA Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/ha-image.tar
          key: ha-docker-${{ hashFiles('docker-compose.dev.yml') }}

      - name: Load or pull HA image
        run: |
          if [ -f /tmp/ha-image.tar ]; then
            docker load < /tmp/ha-image.tar
          else
            docker pull ghcr.io/home-assistant/home-assistant:stable
            docker save ghcr.io/home-assistant/home-assistant:stable > /tmp/ha-image.tar
          fi

      - name: Run golden v2 E2E tests
        run: pytest tests/e2e/test_golden_v2_e2e.py -v --timeout=600

  e2e-sensors:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Cache HA Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/ha-image.tar
          key: ha-docker-${{ hashFiles('docker-compose.dev.yml') }}

      - name: Load or pull HA image
        run: |
          if [ -f /tmp/ha-image.tar ]; then
            docker load < /tmp/ha-image.tar
          else
            docker pull ghcr.io/home-assistant/home-assistant:stable
            docker save ghcr.io/home-assistant/home-assistant:stable > /tmp/ha-image.tar
          fi

      - name: Run sensor E2E tests
        run: pytest tests/e2e/test_sensors_e2e.py -v --timeout=600

  e2e-ui:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Cache HA Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/ha-image.tar
          key: ha-docker-${{ hashFiles('docker-compose.dev.yml') }}

      - name: Load or pull HA image
        run: |
          if [ -f /tmp/ha-image.tar ]; then
            docker load < /tmp/ha-image.tar
          else
            docker pull ghcr.io/home-assistant/home-assistant:stable
            docker save ghcr.io/home-assistant/home-assistant:stable > /tmp/ha-image.tar
          fi

      - name: Run Playwright UI tests
        run: pytest tests/e2e/test_dashboard_playwright.py -v --timeout=300

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
