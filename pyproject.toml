[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rain-incoming"
version = "0.1.0"
description = "Home Assistant integration that detects approaching rain using radar data"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "pytest-cov>=4.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.0",
    "aiohttp>=3.9",
    "aioresponses>=0.7",
    "playwright>=1.40",
    "mutmut>=2.5,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.coverage.run]
# Single source root so the coverage XML has one <source>.</source> element
# with fully-qualified filenames like "custom_components/rain_incoming/foo.py".
# SonarCloud needs this to map coverage to sonar.sources.
source = ["."]
include = ["custom_components/rain_incoming/*", "scripts/*"]
relative_files = true
omit = ["tests/*"]

[tool.mutmut]
paths_to_mutate = "custom_components/rain_incoming/radar/motion.py"
runner = "python -m pytest tests/unit/radar/test_motion.py -x -q --no-header --tb=line"
tests_dir = "tests/unit/radar/"
